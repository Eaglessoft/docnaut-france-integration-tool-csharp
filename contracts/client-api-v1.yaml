openapi: 3.1.0
info:
  title: France Connector Client API
  version: 1.0.0
  description: |
    Tenant-scoped API of the France Connector client surface. Every route under `/client/api/v1` except
    `secret-provisions` requires a Keycloak bearer JWT (audience `france-connector-client-api`) issued to one
    service client of one company; the tenant is resolved from the token and never appears in a route.
    `x-fc-permission` names the client permission the token must carry. Body-bearing failures are RFC 9457
    problem documents carrying the France Connector error catalogue code (`FC-*`); every response repeats the
    request correlation identifier in `X-Correlation-ID`.
servers:
  - url: http://localhost:8081
    description: Dev Container client surface
security:
  - bearerAuth: []
tags:
  - name: profile
  - name: configuration
  - name: service-client
  - name: documents
  - name: decisions
  - name: reports
  - name: peppol
  - name: webhooks
  - name: provisioning
  - name: health
webhooks:
  documentNotification:
    post:
      summary: Signed notification sent to the subscription endpoint.
      description: |
        Outbound POST to the registered client endpoint, not a Connector route. Body is unwrapped JSON.
        Verify HMAC-SHA256 using UTF-8 bytes of the issued secret as key; do not Base64-decode it.
        Sign ASCII prefix v1\n<timestamp>\n<eventId>\n<deliveryId>\n followed by exact raw body bytes;
        each \n represents one LF byte. Compare v1= plus lowercase hex digest with the signature header
        in constant time. Check timestamp freshness using the receiver's replay window.
        Retries have a new signing timestamp. Deduplicate by eventId; retries retain deliveryId,
        administrator replay creates a new deliveryId for the same eventId. Do not rely on ordering.

        Any 2xx acknowledges a regular event; its response body is ignored. Maximum seven attempts:
        initial send, then delays of 1 minute, 5 minutes, 30 minutes, 2 hours, 8 hours and 24 hours
        after the previous attempt, with 0-20 percent positive jitter. HTTP 408, 425, 429, 5xx and
        transient transport failures retry; other failures including redirects are final.
        Longer Retry-After overrides the base delay, capped at 24 hours before jitter.

        Verification uses the same signature headers and requires a 2xx JSON response containing
        exactly one property {"challenge":"<data.challenge from the request>"}. No envelope or extra
        properties. Failure returns the subscription to DRAFT; call verify again.
        Verification does not use the regular event retry schedule.

        Notifications contain document references only. Fetch details through document APIs.
        Report acceptance/rejection and decision-leg completion have no public webhook.
        Poll GET /client/api/v1/reports/{reportId}, GET /client/api/v1/reports/{reportId}/receipts
        and GET /client/api/v1/documents/{documentId}/decision as applicable.
        Intake ACCEPTED means stored for processing; transport UPLOADED means uploaded, not business
        acceptance. Read correlated receipts for the remote business outcome.
      security: []
      parameters:
        - {name: X-Docnaut-Webhook-Version, in: header, required: true, schema: {type: string, const: '1'}, description: Signature protocol version.}
        - {name: X-Docnaut-Webhook-Key-Version, in: header, required: true, schema: {type: integer, minimum: 1}, description: Signing key version; rotation replaces the old key immediately.}
        - {name: X-Docnaut-Webhook-Timestamp, in: header, required: true, schema: {type: integer, format: int64}, description: Attempt signing time in Unix epoch seconds.}
        - {name: X-Docnaut-Webhook-Event-Id, in: header, required: true, schema: {type: string, format: uuid}, description: Event ID matching the body.}
        - {name: X-Docnaut-Webhook-Delivery-Id, in: header, required: true, schema: {type: string, format: uuid}, description: Delivery ID matching the body.}
        - {name: X-Docnaut-Webhook-Signature, in: header, required: true, schema: {type: string, pattern: '^v1=[0-9a-f]{64}$'}, description: HMAC-SHA256 of the prefix and raw body.}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - {$ref: '#/components/schemas/WebhookDocumentNotification'}
                - {$ref: '#/components/schemas/WebhookVerificationNotification'}
      responses:
        '200':
          description: Regular event acknowledged; verification requires the exact challenge object.
          content:
            application/json:
              schema:
                description: Verification must match WebhookChallengeResponse; regular event response bodies are ignored.
                anyOf:
                  - {$ref: '#/components/schemas/WebhookChallengeResponse'}
                  - {}
        '204':
          description: Regular event acknowledged; invalid for verification.
paths:
  /client/api/v1/profile:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    get:
      tags: [profile]
      operationId: getClientProfile
      x-fc-permission: client.profile.read
      summary: The calling service client, its company and its effective permissions.
      responses:
        '200':
          description: Profile of the caller.
          headers:
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Profile'}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '503': {$ref: '#/components/responses/DataUnavailable'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
  /client/api/v1/configuration:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    get:
      tags: [configuration]
      operationId: getClientConfiguration
      x-fc-permission: client.configuration.read
      summary: The company's client preferences with their optimistic-locking version as ETag.
      responses:
        '200':
          description: Current preference.
          headers:
            ETag: {description: "Quoted preference version, required for PUT.", schema: {type: string}}
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Preference'}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '503': {$ref: '#/components/responses/DataUnavailable'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
    put:
      tags: [configuration]
      operationId: replaceClientConfiguration
      x-fc-permission: client.configuration.manage
      summary: Replaces the company's client preferences; the If-Match version must match the stored one.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PreferenceReplace'}
      responses:
        '200':
          description: Replaced preference with its new version.
          headers:
            ETag: {schema: {type: string}}
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Preference'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '409': {$ref: '#/components/responses/ConcurrentModification'}
        '503': {$ref: '#/components/responses/DataUnavailable'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
  /client/api/v1/service-client/rotate-secret:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    post:
      tags: [service-client]
      operationId: rotateOwnServiceClientSecret
      x-fc-permission: client.service-client.rotate-secret
      summary: Rotates the caller's own Keycloak client secret; the new secret is returned exactly once.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReasonRequest'}
      responses:
        '200':
          description: "One-time secret; the response is marked `Cache-Control: no-store`."
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OneTimeSecret'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
  /client/api/v1/documents:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    post:
      tags: [documents]
      operationId: createDocumentIntake
      x-fc-permission: client.document.submit
      summary: Submits one outbound UBL, CII or Factur-X document (at most 100 MiB) for processing.
      description: |
        The body is spooled, classified and validated before it is stored once under an immutable key and
        handed to processing. Byte 100 MiB + 1 is rejected with 413. A replay of the same
        `Idempotency-Key` with the same content returns the original document with 200.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [source]
              properties:
                source:
                  type: string
                  format: binary
                  description: The document (`application/xml`, `text/xml` or `application/pdf`).
      responses:
        '201':
          description: Document accepted.
          headers:
            Location: {description: Canonical document read location., schema: {type: string}}
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentIntakeResult'}
        '200':
          description: Same-key replay of an accepted intake.
          headers:
            Location: {schema: {type: string}}
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentIntakeResult'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        '503': {$ref: '#/components/responses/StorageUnavailable'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
    get:
      tags: [documents]
      operationId: listDocuments
      x-fc-permission: client.document.read
      summary: Lists the company's documents, newest first, by opaque keyset cursor.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of documents.
          headers:
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DocumentPage'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '503': {$ref: '#/components/responses/DataUnavailable'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
  /client/api/v1/documents/{documentTraceId}:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/DocumentTraceId'
    get:
      tags: [documents]
      operationId: getDocument
      x-fc-permission: client.document.read
      summary: One document of the company.
      responses:
        '200':
          description: The document.
          headers:
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Document'}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '503': {$ref: '#/components/responses/DataUnavailable'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
  /client/api/v1/documents/{documentTraceId}/events:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/DocumentTraceId'
    get:
      tags: [documents]
      operationId: listDocumentEvents
      x-fc-permission: client.document.event.read
      summary: Client-visible domain events of one document.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of events.
          headers:
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EventPage'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '503': {$ref: '#/components/responses/DataUnavailable'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
  /client/api/v1/documents/{documentTraceId}/artifacts:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/DocumentTraceId'
    get:
      tags: [documents]
      operationId: listDocumentArtifacts
      x-fc-permission: client.document.artifact.read
      summary: Stored artifacts of one document (source, reports, validation evidence).
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of artifacts.
          headers:
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ArtifactPage'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '503': {$ref: '#/components/responses/DataUnavailable'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
  /client/api/v1/documents/{documentTraceId}/processing:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/DocumentTraceId'
    get:
      tags: [documents]
      operationId: getDocumentProcessing
      x-fc-permission: client.document.read
      summary: The latest execution and the document transaction log, including delivery and MLS evidence.
      parameters:
        - name: logPage
          in: query
          description: Zero-based page of transaction records, newest first, 50 records per page.
          schema: {type: integer, minimum: 0, maximum: 10000, default: 0}
      responses:
        '200':
          description: Processing view.
          headers:
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Processing'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '503': {$ref: '#/components/responses/DataUnavailable'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
  /client/api/v1/documents/{documentTraceId}/artifacts/{artifactId}/access:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/DocumentTraceId'
      - name: artifactId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [documents]
      operationId: createArtifactAccess
      x-fc-permission: client.document.artifact.download
      summary: Streams one artifact after verifying its digest; every download is audited.
      description: Range requests are not supported and are rejected with 400.
      responses:
        '200':
          description: The artifact bytes as an attachment.
          headers:
            Content-Disposition: {schema: {type: string}}
            Cache-Control: {schema: {type: string, const: no-store}}
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
          content:
            application/xml: {schema: {type: string, format: binary}}
            application/pdf: {schema: {type: string, format: binary}}
            application/json: {schema: {type: string, format: binary}}
            application/octet-stream: {schema: {type: string, format: binary}}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '503': {$ref: '#/components/responses/StorageUnavailable'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
  /client/api/v1/documents/{documentId}/decision:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: documentId
        in: path
        required: true
        description: Connector-owned UUID of the company's assigned inbound invoice.
        schema: {type: string, format: uuid}
    post:
      tags: [decisions]
      operationId: decideInboundInvoice
      x-fc-permission: client.document.decision.manage
      summary: Records a buyer decision, including Chorus-only suspension, on an inbound invoice.
      description: |
        Each action is immutable. Chorus invoices allow SUSPENDED followed by ACCEPTED or REFUSED;
        other sources retain one final decision. A subsequent action requires the suspension CDV to be
        uploaded without a recorded negative receipt. GET returns the latest action and ordered history.
        Chorus actions use only the Chorus leg. For other sources: `ppf` references the F6 210 lifecycle report
        generated for a refusal (`reportId`) and mirrors that report's status; `peppol` is the typed outcome
        of the real Peppol Invoice Response submission. A same-key same-fingerprint replay returns the
        original action.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyUuid'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InvoiceDecisionRequest'}
      responses:
        '202':
          description: Stable decision action, including a replay.
          headers:
            Location: {description: Canonical read location of the decision., schema: {type: string}}
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvoiceDecisionAction'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '409': {$ref: '#/components/responses/DecisionConflict'}
        '503': {$ref: '#/components/responses/DataUnavailable'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
    get:
      tags: [decisions]
      operationId: getInboundInvoiceDecision
      x-fc-permission: client.document.decision.manage
      summary: Reads the latest decision, ordered history and current applicable delivery states.
      responses:
        '200':
          description: Existing decision action.
          headers:
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvoiceDecisionAction'}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '503': {$ref: '#/components/responses/DataUnavailable'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
  /client/api/v1/peppol/facts:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    get:
      tags: [peppol]
      operationId: listPeppolFacts
      x-fc-permission: client.document.event.read
      summary: Peppol delivery facts of the company (MLS outcomes, time-outs and inbound availability).
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of facts, newest first.
          headers:
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PeppolFactPage'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '503': {$ref: '#/components/responses/DataUnavailable'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
  /client/api/v1/reports/{reportId}/receipts:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: reportId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [reports]
      operationId: getReportReceipts
      summary: Read correlated PPF receipts for an owned report
      description: Upload is distinct from business acceptance. An empty list means no correlated receipt has been recorded. Returns at most 100 receipts in arrival order.
      x-fc-permission: client.document.read
      responses:
        '200':
          description: Immutable correlated receipts
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    interfaceCode: { type: string }
                    correlationStatus: { type: string }
                    correlationReason: { type: string }
                    businessStatus: { type: string }
                    remoteStatusCode: { type: string }
                    remoteReason: { type: string }
                    sha256: { type: string }
                    receivedAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/AuthenticationFailed' }
        '403': { $ref: '#/components/responses/PermissionDenied' }
        '404': { $ref: '#/components/responses/ResourceNotFound' }
        '503': { $ref: '#/components/responses/DataUnavailable' }
        '500': { $ref: '#/components/responses/UnexpectedError' }
  /client/api/v1/reports/{reportId}:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: reportId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [reports]
      operationId: getReport
      x-fc-permission: client.document.read
      summary: The company's view of one regulatory report (F1, F6 or F10) and its transport state.
      responses:
        '200':
          description: The report.
          headers:
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Report'}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '503': {$ref: '#/components/responses/DataUnavailable'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
  /client/api/v1/documents/{documentId}/payments:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: documentId
        in: path
        required: true
        description: Public documentTraceId returned by document submission or reads, for an owned supplier invoice with a validated deposit fact.
        schema: {type: string, format: uuid}
    post:
      tags: [reports]
      operationId: registerInvoicePayment
      x-fc-permission: client.document.submit
      summary: Records immutable actual payment facts and produces one F6 212 report.
      description: |
        The document and supplier belong to the authenticated company. Occurrence is between the invoice
        issue date and now. Same key and identical values replay; conflicting keys or payment references fail.
        Registration is not remote upload or PPF acceptance. Cash amounts include VAT; negative disbursement
        requires a cancellation reason. Every amount, including zero, requires signed VAT allocation.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InvoicePaymentCommand'}
      responses:
        '201':
          description: Payment recorded and lifecycle report generated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvoicePaymentResult'}
        '200':
          description: Immutable payment replayed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InvoicePaymentResult'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '503': {$ref: '#/components/responses/StorageUnavailable'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
  /client/api/v1/reporting-periods/{period}/transmissions:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: period
        in: path
        required: true
        description: Reporting month, YYYY-MM; must match the supplied XML.
        schema: {type: string, pattern: '^[0-9]{4}-[0-9]{2}$'}
    post:
      tags: [reports]
      operationId: submitReportingTransmission
      x-fc-permission: client.document.submit
      summary: Submits a categorized immutable initial or corrective F10 revision.
      description: |
        Validates the prepared XML against official schemas and authenticated declarant, period, category
        and transmission type. SALES and COLLECTIONS have separate initial reports. CORRECTION references
        the latest same-company/period/category report with established dispatch; UNKNOWN does not qualify.
        Prior bytes remain immutable. Server assigns sequential revisions; concurrent forks are rejected.
        Reports remain pending until explicitly released through EDI Operations. No successful bypass is implied.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [source, metadata]
              properties:
                source: {type: string, format: binary, description: Prepared F10 XML, at most 10 MiB.}
                metadata: {$ref: '#/components/schemas/ReportingTransmissionCommand'}
            encoding:
              metadata: {contentType: application/json}
              source: {contentType: application/xml}
      responses:
        '201':
          description: Immutable F10 revision generated.
          headers:
            Location: {description: Canonical report read location., schema: {type: string}}
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportingTransmissionResult'}
        '200':
          description: Same-key replay of a transmission.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReportingTransmissionResult'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/ReportValidationFailed'}
        '503': {$ref: '#/components/responses/StorageUnavailable'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
  /client/api/v1/webhook-subscriptions:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    get:
      tags: [webhooks]
      operationId: listClientWebhookSubscriptions
      x-fc-permission: client.webhook.read
      summary: The company's webhook subscriptions.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of subscriptions.
          headers:
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookSubscriptionPage'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '503': {$ref: '#/components/responses/DataUnavailable'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
    post:
      tags: [webhooks]
      operationId: createClientWebhookSubscription
      x-fc-permission: client.webhook.manage
      summary: Creates a DRAFT subscription; the signing secret is returned exactly once.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WebhookSubscriptionCreate'}
      responses:
        '201':
          description: "Subscription and its one-time signing secret (`Cache-Control: no-store`)."
          headers:
            Location: {schema: {type: string}}
            Cache-Control: {schema: {type: string, const: no-store}}
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookSecretIssued'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '503': {$ref: '#/components/responses/DataUnavailable'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
  /client/api/v1/webhook-subscriptions/{subscriptionId}:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/SubscriptionId'
    get:
      tags: [webhooks]
      operationId: getClientWebhookSubscription
      x-fc-permission: client.webhook.read
      summary: One subscription with its version as ETag.
      responses:
        '200':
          description: The subscription.
          headers:
            ETag: {schema: {type: string}}
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookSubscription'}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '503': {$ref: '#/components/responses/DataUnavailable'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
    patch:
      tags: [webhooks]
      operationId: updateClientWebhookSubscription
      x-fc-permission: client.webhook.manage
      summary: Changes name, endpoint, event selection or activation; If-Match carries the version.
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WebhookSubscriptionUpdate'}
      responses:
        '200':
          description: Updated subscription.
          headers:
            ETag: {schema: {type: string}}
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookSubscription'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '409': {$ref: '#/components/responses/ConcurrentModification'}
        '503': {$ref: '#/components/responses/DataUnavailable'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
  /client/api/v1/webhook-subscriptions/{subscriptionId}/verify:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/SubscriptionId'
    post:
      tags: [webhooks]
      operationId: verifyClientWebhookSubscription
      x-fc-permission: client.webhook.manage
      summary: Starts endpoint verification; the challenge is delivered asynchronously.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Verification started (or already running).
          headers:
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookVerification'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '409': {$ref: '#/components/responses/StateConflict'}
        '503': {$ref: '#/components/responses/DataUnavailable'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
  /client/api/v1/webhook-subscriptions/{subscriptionId}/rotate-secret:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/SubscriptionId'
    post:
      tags: [webhooks]
      operationId: rotateClientWebhookSecret
      x-fc-permission: client.webhook.manage
      summary: Issues a new signing secret; the previous one stops signing immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReasonRequest'}
      responses:
        '200':
          description: "One-time signing secret (`Cache-Control: no-store`)."
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookSecretRotated'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '503': {$ref: '#/components/responses/DataUnavailable'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
  /client/api/v1/webhook-deliveries:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    get:
      tags: [webhooks]
      operationId: listClientWebhookDeliveries
      x-fc-permission: client.webhook.delivery.read
      summary: Delivery history, optionally restricted to one subscription.
      parameters:
        - name: subscriptionId
          in: query
          required: false
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of deliveries with their attempts.
          headers:
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookDeliveryPage'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '503': {$ref: '#/components/responses/DataUnavailable'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
  /client/api/v1/webhook-deliveries/{deliveryId}:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: deliveryId
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [webhooks]
      operationId: getClientWebhookDelivery
      x-fc-permission: client.webhook.delivery.read
      summary: One delivery with every attempt.
      responses:
        '200':
          description: The delivery.
          headers:
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookDelivery'}
        '401': {$ref: '#/components/responses/AuthenticationFailed'}
        '403': {$ref: '#/components/responses/PermissionDenied'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '503': {$ref: '#/components/responses/DataUnavailable'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
  /client/api/v1/secret-provisions:
    parameters:
      - $ref: '#/components/parameters/CorrelationId'
    post:
      tags: [provisioning]
      operationId: generateProvisionedSecret
      security: []
      summary: Redeems a one-time provisioning token from the emailed link and returns the client secret once.
      description: |
        Called by the `/client/secret-provision` page. The token is peppered, hashed and single-use; an
        expired, consumed or unknown token is reported as not found. No bearer token is involved.
      parameters:
        - name: X-Provisioning-Token
          in: header
          required: true
          description: The raw token from the provisioning link fragment.
          schema: {type: string, minLength: 1}
      responses:
        '200':
          description: "The generated client secret (`Cache-Control: no-store`, `default-src 'none'` CSP)."
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            X-Correlation-ID: {$ref: '#/components/headers/CorrelationId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OneTimeSecret'}
        '400': {$ref: '#/components/responses/ValidationFailed'}
        '404': {$ref: '#/components/responses/ResourceNotFound'}
        '503': {$ref: '#/components/responses/DependencyUnavailable'}
        '500': {$ref: '#/components/responses/UnexpectedError'}
  /actuator/health/liveness:
    get:
      tags: [health]
      operationId: getLiveness
      security: []
      summary: Kubernetes liveness probe of the client surface.
      responses:
        '200': {$ref: '#/components/responses/HealthUp'}
        '503': {$ref: '#/components/responses/HealthDown'}
  /actuator/health/readiness:
    get:
      tags: [health]
      operationId: getReadiness
      security: []
      summary: Kubernetes readiness probe (readiness state and intake spool disk space).
      responses:
        '200': {$ref: '#/components/responses/HealthUp'}
        '503': {$ref: '#/components/responses/HealthDown'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Keycloak access token of a company service client (audience `france-connector-client-api`).
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: Caller-supplied correlation identifier (at most 128 characters); generated when absent.
      schema: {type: string, maxLength: 128}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Tenant-scoped idempotency key; reuse with a different request fingerprint is a conflict.
      schema: {type: string, minLength: 1, maxLength: 255}
    IdempotencyKeyUuid:
      name: Idempotency-Key
      in: header
      required: true
      description: Tenant-scoped idempotency key in UUID form.
      schema: {type: string, format: uuid}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted version returned as ETag by the last read.
      schema: {type: string, pattern: '^"[0-9]+"$'}
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque keyset cursor from `nextCursor`; malformed cursors are rejected with 400.
      schema: {type: string}
    Limit:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    DocumentTraceId:
      name: documentTraceId
      in: path
      required: true
      description: Tenant-visible document trace identifier returned by the intake `Location`.
      schema: {type: string, format: uuid}
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      schema: {type: string, format: uuid}
  headers:
    CorrelationId:
      description: The correlation identifier of this request.
      schema: {type: string}
  schemas:
    Profile:
      type: object
      required: [serviceClientId, tenant, permissions]
      properties:
        serviceClientId: {type: string}
        tenant:
          type: object
          required: [name, status]
          properties:
            name: {type: string}
            status: {type: string, enum: [ACTIVE, INACTIVE]}
        permissions: {type: array, items: {type: string}}
    Preference:
      type: object
      required: [preferredLocale, preferredTimeZone, version]
      properties:
        preferredLocale: {type: string, maxLength: 35}
        preferredTimeZone: {type: string, maxLength: 64}
        version: {type: integer, format: int64}
    PreferenceReplace:
      type: object
      required: [preferredLocale, preferredTimeZone]
      properties:
        preferredLocale: {type: string, minLength: 1, maxLength: 35}
        preferredTimeZone: {type: string, minLength: 1, maxLength: 64}
    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: {type: string, minLength: 3, maxLength: 500, description: Audited operator reason.}
    OneTimeSecret:
      type: object
      required: [secret, rotatedAt]
      properties:
        secret: {type: string, description: Shown exactly once; never logged.}
        rotatedAt: {type: string, format: date-time}
    DocumentIntakeResult:
      type: object
      required: [document, replayed, replayReason]
      properties:
        document: {$ref: '#/components/schemas/IntakeDocument'}
        replayed: {type: boolean}
        replayReason: {type: string, enum: [NONE, IDEMPOTENCY_KEY]}
    IntakeDocument:
      type: object
      required: [documentTraceId, originalFileName, mediaType, contentLength, sha256, intakeStatus, createdAt]
      properties:
        documentTraceId: {type: string, format: uuid}
        documentYear: {type: [integer, 'null']}
        tenantDocumentNumber: {type: [string, 'null'], maxLength: 100}
        declaredDocumentCategory: {type: [string, 'null'], enum: [INVOICE, CREDIT_NOTE, null]}
        originalFileName: {type: string, maxLength: 255}
        mediaType: {type: string, enum: [application/xml, text/xml, application/pdf]}
        contentLength: {type: integer, format: int64, minimum: 1, maximum: 104857600}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        intakeStatus: {type: string, const: ACCEPTED, description: Stored for processing; not delivery or business acceptance.}
        createdAt: {type: string, format: date-time}
    Document:
      type: object
      required: [documentTraceId, originalFileName, mediaType, contentLength, sha256, intakeStatus, createdAt]
      properties:
        documentTraceId: {type: string, format: uuid}
        documentYear: {type: [integer, 'null']}
        tenantDocumentNumber: {type: [string, 'null']}
        declaredDocumentCategory: {type: [string, 'null']}
        originalFileName: {type: string}
        mediaType: {type: string}
        contentLength: {type: integer, format: int64}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        intakeStatus: {type: string}
        createdAt: {type: string, format: date-time}
    DocumentPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Document'}}
        nextCursor: {type: [string, 'null']}
    Event:
      type: object
      required: [eventId, documentTraceId, type, occurredAt]
      properties:
        eventId: {type: string, format: uuid}
        documentTraceId: {type: string, format: uuid}
        type: {type: string, description: Client-visible domain event type.}
        occurredAt: {type: string, format: date-time}
    EventPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Event'}}
        nextCursor: {type: [string, 'null']}
    Artifact:
      type: object
      required: [artifactId, type, mediaType, contentLength, sha256, createdAt]
      properties:
        artifactId: {type: string, format: uuid}
        type: {type: string, description: "Object role, for example DOCUMENT_SOURCE or F1_REPORT."}
        mediaType: {type: string}
        contentLength: {type: integer, format: int64}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
        createdAt: {type: string, format: date-time}
    ArtifactPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Artifact'}}
        nextCursor: {type: [string, 'null']}
    Processing:
      type: object
      required: [executionId, executionNumber, status, currentStage, createdAt, updatedAt, attempts, transactionLog]
      properties:
        executionId: {type: string, format: uuid}
        executionNumber: {type: integer, format: int64}
        status: {$ref: '#/components/schemas/ProcessingStatus'}
        currentStage: {$ref: '#/components/schemas/ProcessingStage'}
        safeErrorCode: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        attempts: {type: array, items: {$ref: '#/components/schemas/ProcessingAttempt'}}
        transactionLog: {$ref: '#/components/schemas/TransactionLog'}
    ProcessingStatus:
      type: string
      enum: [HELD, PENDING, RUNNING, SUCCEEDED, FAILED, INDETERMINATE, ROUTE_UNAVAILABLE, SUBMISSION_UNKNOWN, SUBMITTED,
             DELIVERED, DELIVERY_REJECTED, DELIVERY_UNKNOWN]
    ProcessingStage:
      type: string
      enum: [DETECT, VALIDATE, EXTRACT, PREPARE_REPORTS, RESOLVE_RECIPIENT, RESOLVE_TRANSPORT, SUBMIT]
    ProcessingAttempt:
      type: object
      required: [stage, attemptNumber, outcome, retryable, startedAt, completedAt]
      properties:
        stage: {$ref: '#/components/schemas/ProcessingStage'}
        attemptNumber: {type: integer, minimum: 1}
        outcome:
          type: string
          enum: [SUCCEEDED, INVALID, INDETERMINATE, ROUTE_UNAVAILABLE, SUBMISSION_HELD, SUBMISSION_ACCEPTED, SUBMISSION_REJECTED,
                 SUBMISSION_UNKNOWN, SUBMISSION_BLOCKED]
        retryable: {type: boolean}
        safeErrorCode: {type: [string, 'null']}
        startedAt: {type: string, format: date-time}
        completedAt: {type: string, format: date-time}
    TransactionLog:
      type: object
      required: [entries, page, hasNext]
      properties:
        entries: {type: array, items: {$ref: '#/components/schemas/ExternalCall'}}
        page: {type: integer, minimum: 0}
        hasNext: {type: boolean}
    ExternalCall:
      type: object
      required: [id, system, operation, outcome, request, details, occurredAt]
      properties:
        system: {type: string, description: "External system name, for example PHOSS, PHORM or PPF."}
        operation: {type: string}
        outcome: {type: string, enum: [SUCCEEDED, FAILED, TIMEOUT, REJECTED, INDETERMINATE, BYPASSED]}
        id: {type: string, format: uuid}
        executionId: {type: [string, 'null'], format: uuid}
        decisionId: {type: [string, 'null'], format: uuid}
        request: {type: object, description: Safe request identifiers; no credentials or XML payload.}
        details:
          type: object
          description: Delivery or MLS evidence including HTTP status, remote state, error details, verification result/details, response descriptions, notes, line errors and artifact reference when available. An attempt failure is not a terminal document rejection.
        safeErrorCode: {type: [string, 'null']}
        correlationId: {type: [string, 'null']}
        occurredAt: {type: string, format: date-time}
    InvoiceDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: {type: string, enum: [ACCEPTED, REFUSED, SUSPENDED]}
        reasonCode:
          type: [string, 'null']
          minLength: 1
          maxLength: 64
          description: Required for REFUSED and SUSPENDED. Chorus requires the status-specific AFNOR reason code; SUSPENDED is Chorus-only.
        comment:
          type: [string, 'null']
          minLength: 1
          maxLength: 500
          description: Required for REFUSED and SUSPENDED; leading/trailing whitespace and control characters are rejected.
        expectedAction: {$ref: '#/components/schemas/ExpectedAction'}
    ExpectedAction:
      type: [string, 'null']
      enum: [NOA, PIN, NIN, CNF, CNP, CNA, OTH, null]
      description: Optional Peppol OPStatusAction code for REFUSED.
    PpfActionLeg:
      type: object
      required: [status, correlationId]
      properties:
        status: {type: string, enum: [NOT_APPLICABLE, PREPARING, VALIDATED, TRANSMITTED, BYPASSED, VALIDATION_FAILED, FAILED]}
        errorCode: {type: [string, 'null'], maxLength: 64}
        reportId:
          type: [string, 'null']
          format: uuid
          description: The F6 210 report this leg mirrors; readable through `getReport`.
        correlationId: {type: string, minLength: 1, maxLength: 128}
    PeppolActionLeg:
      type: object
      required: [status, correlationId]
      properties:
        status: {type: string, enum: [NOT_APPLICABLE, PREPARING, SUBMITTED, REJECTED, UNKNOWN, ROUTE_UNAVAILABLE, FAILED]}
        errorCode: {type: [string, 'null'], maxLength: 64}
        reportId: {type: [string, 'null'], format: uuid, description: Always null for the Peppol leg.}
        correlationId: {type: string, minLength: 1, maxLength: 128}
    InvoiceDecisionAction:
      type: object
      required: [decisionId, documentId, decision, ppf, peppol, chorus, actorServiceClientId, createdAt, sequence, history]
      properties:
        sequence: {type: integer, minimum: 1}
        history:
          type: array
          description: Ordered immutable action history with current Chorus delivery states; POST replay retains its original snapshot.
          items: {$ref: '#/components/schemas/InvoiceDecisionHistoryEntry'}
        decisionId: {type: string, format: uuid}
        documentId: {type: string, format: uuid}
        decision: {type: string, enum: [ACCEPTED, REFUSED, SUSPENDED]}
        reasonCode: {type: [string, 'null']}
        comment: {type: [string, 'null']}
        expectedAction: {$ref: '#/components/schemas/ExpectedAction'}
        ppf: {$ref: '#/components/schemas/PpfActionLeg'}
        peppol: {$ref: '#/components/schemas/PeppolActionLeg'}
        chorus: {$ref: '#/components/schemas/ChorusActionLeg'}
        actorServiceClientId: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
    InvoiceDecisionHistoryEntry:
      type: object
      required: [decisionId, sequence, decision, chorus, actorServiceClientId, createdAt]
      properties:
        decisionId: {type: string, format: uuid}
        sequence: {type: integer, minimum: 1, description: Immutable per-document action order.}
        decision: {type: string, enum: [ACCEPTED, REFUSED, SUSPENDED]}
        reasonCode: {type: [string, 'null']}
        comment: {type: [string, 'null']}
        expectedAction: {$ref: '#/components/schemas/ExpectedAction'}
        chorus: {$ref: '#/components/schemas/ChorusActionLeg'}
        actorServiceClientId: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
    PeppolFact:
      type: object
      required: [id, type, observedAt, late]
      properties:
        id: {type: string, format: uuid}
        type: {type: string, enum: [MLS_AP, MLS_AB, MLS_RE, MLS_TIMEOUT, INBOUND_AVAILABLE]}
        expectationId: {type: [string, 'null'], format: uuid}
        documentId: {type: [string, 'null'], format: uuid}
        observedAt: {type: string, format: date-time}
        late: {type: boolean}
    PeppolFactPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/PeppolFact'}}
        nextCursor: {type: [string, 'null']}
    InvoicePaymentCommand:
      type: object
      required: [paymentReference, occurredAt, payment]
      properties:
        paymentReference: {type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,99}$', description: Immutable payment identity within the invoice.}
        occurredAt: {type: string, format: date-time, description: Actual payment occurrence; no earlier than invoice issue or later than now.}
        payment:
          type: object
          required: [amount, currency, vatBreakdown]
          properties:
            amount: {type: number, description: Signed cash collected including VAT; up to 13 integer and 6 fractional digits.}
            currency: {type: string, pattern: '^[A-Z]{3}$', description: Payment currency.}
            vatBreakdown:
              type: array
              minItems: 1
              maxItems: 100
              description: Unique VAT rates; signed allocations sum exactly to amount.
              items:
                type: object
                required: [rate, amount]
                properties:
                  rate: {type: number, minimum: 0, maximum: 100, multipleOf: 0.01, description: VAT percentage.}
                  amount: {type: number, description: Cash collected at this VAT rate; same sign as payment.}
            cancellationReason: {type: [string, 'null'], maxLength: 2000, description: Required cancellation explanation for negative disbursement.}
            remainingAmount: {type: 'null', description: Omit or use null. Non-null values receive HTTP 400 because this contract has no VAT allocation for remaining amounts.}
            discountAmount: {type: 'null', description: Omit or use null. Non-null values receive HTTP 400 because this contract has no VAT allocation for discounts.}
    InvoicePaymentResult:
      type: object
      required: [paymentId, reportId, replayed]
      properties:
        paymentId: {type: string, format: uuid, description: Immutable payment fact.}
        reportId: {type: string, format: uuid, description: Generated F6 212 report.}
        replayed: {type: boolean, description: True when returning the existing fact/report.}
    ReportingTransmissionCommand:
      type: object
      required: [category, kind]
      properties:
        category: {type: string, enum: [SALES, COLLECTIONS], description: Independent initial transmission category.}
        kind: {type: string, enum: [INITIAL, CORRECTION], description: Initial declaration or linked corrective revision.}
        previousReportId: {type: [string, 'null'], format: uuid, description: Required latest same-category report for correction; absent for initial.}
    ReportingTransmissionResult:
      type: object
      required: [report, category, kind, revision, replayed]
      properties:
        category: {type: string, enum: [SALES, COLLECTIONS], description: Validated category.}
        kind: {type: string, enum: [INITIAL, CORRECTION], description: Validated transmission kind.}
        revision: {type: integer, minimum: 1, description: Server-assigned monotonic category revision.}
        previousReportId: {type: [string, 'null'], format: uuid, description: Preserved prior report linkage for a correction.}
        report: {$ref: '#/components/schemas/Report'}
        replayed: {type: boolean, description: True for a same-key immutable replay.}
    ChorusActionLeg:
      type: object
      required: [status, correlationId]
      properties:
        status: {type: string, enum: [NOT_APPLICABLE, PREPARING, HELD, READY, SENDING, UPLOADED, RETRYABLE, UNKNOWN, FAILED], description: Actual Chorus transport state; UPLOADED is not business acceptance.}
        errorCode: {type: [string, 'null'], maxLength: 64, description: Latest negative Chorus receipt code (501 or 601) when present; transport status remains unchanged.}
        reportId: {type: [string, 'null'], format: uuid, description: Chorus EDI transmission ID for this leg.}
        correlationId: {type: string, description: Decision action correlation identifier.}
    Report:
      type: object
      required: [reportId, interfaceCode, kind, status, createdAt]
      properties:
        reportId: {type: string, format: uuid}
        interfaceCode: {type: string, enum: [FFE0111A, FFE0112A, FFE0614A, FFE1025A]}
        kind: {type: string, enum: [F1_UBL, F1_CII, F6_INVOICE_LIFECYCLE, F10_REPORTING]}
        status: {type: string, enum: [VALIDATED, TRANSMITTED, BYPASSED, VALIDATION_FAILED]}
        periodStart: {type: [string, 'null'], format: date}
        periodEnd: {type: [string, 'null'], format: date}
        transmittedAt: {type: [string, 'null'], format: date-time}
        transportReference: {type: [string, 'null']}
        createdAt: {type: string, format: date-time}
    WebhookDocumentNotification:
      type: object
      additionalProperties: false
      required: [specVersion, eventType, eventSchema, eventId, deliveryId, occurredAt, documentTraceId, data]
      properties:
        specVersion: {type: string, const: '1.0', description: Envelope version.}
        eventType: {$ref: '#/components/schemas/WebhookEventType'}
        eventSchema: {type: string, description: "client. + lowercase eventType with underscores replaced by hyphens + .v1", example: client.document-intake-accepted.v1}
        eventId: {type: string, format: uuid, description: Stable source event ID.}
        deliveryId: {type: string, format: uuid, description: Delivery ID retained on retry.}
        occurredAt: {type: string, format: date-time, description: Source event time.}
        documentTraceId: {type: string, format: uuid, description: Document reference for Client API reads.}
        data:
          type: object
          additionalProperties: false
          required: [documentTraceId]
          properties:
            documentTraceId: {type: string, format: uuid, description: Same document reference as the top-level field.}
    WebhookVerificationNotification:
      type: object
      additionalProperties: false
      required: [specVersion, eventType, eventSchema, eventId, deliveryId, occurredAt, data]
      properties:
        specVersion: {type: string, const: '1.0'}
        eventType: {type: string, const: WEBHOOK_ENDPOINT_VERIFICATION}
        eventSchema: {type: string, const: client.webhook-endpoint-verification.v1}
        eventId: {type: string, format: uuid}
        deliveryId: {type: string, format: uuid}
        occurredAt: {type: string, format: date-time, description: Verification attempt time.}
        data:
          type: object
          additionalProperties: false
          required: [challenge]
          properties:
            challenge: {type: string, pattern: '^[A-Za-z0-9_-]{20,200}$', description: Echo exactly in the response.}
    WebhookChallengeResponse:
      type: object
      additionalProperties: false
      required: [challenge]
      properties:
        challenge: {type: string, description: Exact data.challenge from the verification request.}
    WebhookEventType:
      type: string
      enum: [DOCUMENT_INTAKE_ACCEPTED, DOCUMENT_TYPE_PROFILE_DETECTED,
             DOCUMENT_DETECTION_FAILED, DOCUMENT_VALIDATION_SUCCEEDED, DOCUMENT_VALIDATION_FAILED,
             DOCUMENT_TRANSFORMATION_SUCCEEDED, DOCUMENT_TRANSFORMATION_FAILED,
             DOCUMENT_F1_PRODUCED, DOCUMENT_F1_FAILED, DOCUMENT_RECIPIENT_ROUTE_RESOLVED,
             DOCUMENT_ROUTE_UNAVAILABLE, DOCUMENT_TRANSPORT_RESOLVED, DOCUMENT_SUBMISSION_ACCEPTED,
             DOCUMENT_SUBMISSION_REJECTED, DOCUMENT_PROCESSING_SUCCEEDED, DOCUMENT_PROCESSING_FAILED,
             DOCUMENT_VALIDATION_REPORT_AVAILABLE, DOCUMENT_SUBMISSION_UNKNOWN, DOCUMENT_RECONCILIATION_EXHAUSTED,
             DOCUMENT_MLS_AP_RECEIVED, DOCUMENT_MLS_AB_RECEIVED, DOCUMENT_MLS_RE_RECEIVED, DOCUMENT_MLS_TIMED_OUT,
             DOCUMENT_MLS_LATE_RECORDED, DOCUMENT_INBOUND_AVAILABLE]
    WebhookEventSelection:
      type: object
      required: [mode]
      properties:
        mode: {type: string, enum: [ALL_CLIENT_EVENTS, SELECTED]}
        eventTypes:
          type: array
          items: {$ref: '#/components/schemas/WebhookEventType'}
          description: Required and non-empty for SELECTED; must be absent or empty for ALL_CLIENT_EVENTS.
    WebhookSubscription:
      type: object
      required: [subscriptionId, name, endpoint, eventSelection, status, version, createdAt, updatedAt, customHeaderNames]
      properties:
        subscriptionId: {type: string, format: uuid}
        name: {type: string, maxLength: 100}
        endpoint: {type: string, format: uri}
        eventSelection: {$ref: '#/components/schemas/WebhookEventSelection'}
        status: {type: string, enum: [DRAFT, VERIFYING, ACTIVE, INACTIVE, DELETED]}
        version: {type: integer, format: int64}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        customHeaderNames: {type: array, items: {type: string}, description: Header names only; values never leave the store.}
    WebhookSubscriptionPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/WebhookSubscription'}}
        nextCursor: {type: [string, 'null']}
    WebhookSubscriptionCreate:
      type: object
      required: [name, endpoint, eventSelection]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        endpoint: {type: string, format: uri, maxLength: 2048, pattern: '^https://.*', description: Public HTTPS endpoint; private and loopback addresses are rejected.}
        eventSelection: {$ref: '#/components/schemas/WebhookEventSelection'}
    WebhookSubscriptionUpdate:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        endpoint: {type: string, format: uri, maxLength: 2048, pattern: '^https://.*'}
        eventSelection: {$ref: '#/components/schemas/WebhookEventSelection'}
        active: {type: boolean, description: Activates a verified subscription or deactivates an active one.}
    WebhookSecretIssued:
      type: object
      required: [subscription, secret, signatureVersion]
      properties:
        subscription: {$ref: '#/components/schemas/WebhookSubscription'}
        secret: {type: string, description: "HMAC signing secret, shown exactly once."}
        signatureVersion: {type: string}
    WebhookVerification:
      type: object
      required: [subscriptionId, status]
      properties:
        subscriptionId: {type: string, format: uuid}
        status: {type: string, enum: [DRAFT, VERIFYING, ACTIVE, INACTIVE, DELETED]}
    WebhookSecretRotated:
      type: object
      required: [subscriptionId, secret, signatureVersion, rotatedAt]
      properties:
        subscriptionId: {type: string, format: uuid}
        secret: {type: string}
        signatureVersion: {type: string}
        rotatedAt: {type: string, format: date-time}
    WebhookDeliveryAttempt:
      type: object
      required: [attemptNumber, startedAt, outcome]
      properties:
        attemptNumber: {type: integer, minimum: 1}
        startedAt: {type: string, format: date-time}
        completedAt: {type: [string, 'null'], format: date-time}
        outcome: {type: string, enum: [PENDING, SUCCEEDED, RETRY_SCHEDULED, EXHAUSTED]}
        httpStatus: {type: [integer, 'null'], minimum: 100, maximum: 599}
        nextAttemptAt: {type: [string, 'null'], format: date-time}
    WebhookDelivery:
      type: object
      required: [deliveryId, subscriptionId, eventId, eventType, status, createdAt, attempts]
      properties:
        deliveryId: {type: string, format: uuid}
        subscriptionId: {type: string, format: uuid}
        eventId: {type: string, format: uuid}
        eventType: {type: string}
        status: {type: string, enum: [PENDING, IN_FLIGHT, DELIVERED, RETRY_SCHEDULED, EXHAUSTED]}
        createdAt: {type: string, format: date-time}
        attempts: {type: array, items: {$ref: '#/components/schemas/WebhookDeliveryAttempt'}}
    WebhookDeliveryPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/WebhookDelivery'}}
        nextCursor: {type: [string, 'null']}
    Health:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [UP, DOWN, OUT_OF_SERVICE, UNKNOWN]}
    Problem:
      type: object
      required: [type, title, status, detail, code, retryable, correlationId]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        code: {type: string, pattern: '^FC-[A-Z]+-[0-9]{4}$', description: France Connector error catalogue code.}
        retryable: {type: boolean}
        correlationId: {type: string}
  responses:
    ValidationFailed:
      description: FC-REQUEST-1001 request validation failed.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    UnsupportedMediaType:
      description: FC-REQUEST-1002 content type not supported.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    PayloadTooLarge:
      description: FC-REQUEST-1003 request payload too large (the single product limit is 100 MiB).
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    AuthenticationFailed:
      description: FC-AUTHN-1001 authentication failed.
      headers: {WWW-Authenticate: {schema: {type: string}}}
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    PermissionDenied:
      description: FC-AUTHZ-1001 permission denied.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    ResourceNotFound:
      description: FC-RESOURCE-1001 resource not found, including any resource of another company.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    ConcurrentModification:
      description: FC-CONFLICT-1001 the If-Match version is stale.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    IdempotencyConflict:
      description: FC-CONFLICT-1002 idempotency key reused with a different request.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    StateConflict:
      description: FC-CONFLICT-1003 the operation conflicts with the current resource state.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    DecisionConflict:
      description: FC-CONFLICT-1002 changed idempotency fingerprint or FC-CONFLICT-1003 existing final decision.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    ReportValidationFailed:
      description: FC-XSLT-1001 the payload failed official validation.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    DependencyUnavailable:
      description: FC-DEPENDENCY-1001 a required service (Keycloak, mail) is temporarily unavailable.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    StorageUnavailable:
      description: FC-STORAGE-1001 or FC-STORAGE-1002 the artifact store is temporarily unavailable.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    DataUnavailable:
      description: FC-DATABASE-1001 the database is temporarily unavailable.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    UnexpectedError:
      description: FC-INTERNAL-1001 unexpected server error.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    HealthUp:
      description: The probe is UP.
      content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}
    HealthDown:
      description: The probe is DOWN or OUT_OF_SERVICE.
      content: {application/json: {schema: {$ref: '#/components/schemas/Health'}}}
