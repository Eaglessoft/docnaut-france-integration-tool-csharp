name: docnaut-france-integration-tool

services:
  test-tool:
    image: ${DOCNAUT_CLIENT_IMAGE:-ghcr.io/eaglessoft/docnaut-france-integration-tool-csharp:latest}
    ports:
      - "127.0.0.1:8093:8080"
    environment:
      ALLOWEDHOSTS: "localhost;127.0.0.1"
      DOCNAUT_SANDBOX_API_BASE_URL: ${DOCNAUT_SANDBOX_API_BASE_URL:-https://france-staging.docnaut.com/client/api/v1/}
      DOCNAUT_SANDBOX_TOKEN_URL: ${DOCNAUT_SANDBOX_TOKEN_URL:-https://france.docnaut.com/sso/realms/docnaut/protocol/openid-connect/token}
      DOCNAUT_PRODUCTION_API_BASE_URL: ${DOCNAUT_PRODUCTION_API_BASE_URL:-https://france.docnaut.com/client/api/v1/}
      DOCNAUT_PRODUCTION_TOKEN_URL: ${DOCNAUT_PRODUCTION_TOKEN_URL:-https://france.docnaut.com/sso/realms/docnaut/protocol/openid-connect/token}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
